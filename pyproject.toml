[project]
name = "pythonshenanigans"
version = "1.1.0"
description = "A Python library for creating, loading and modifying Jujutsu Shenanigans movesets."
authors = [
    {name = "akinari (aki)", email = "pts@itzdanti.dev"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Python 3.14+ ships zstd in the standard library, so a binding is only
    # needed on older interpreters.
    #
    # libjjs pinned `zstd>=1.5.7.3`, but that release is YANKED on PyPI and the
    # pin is therefore uninstallable; pyzstd is used instead.
    "pyzstd (>=0.15.0,<1.0.0); python_version < '3.14'",
]

[project.urls]
Homepage = "https://github.com/dnd-ed/pythonshenanigans"
Repository = "https://github.com/dnd-ed/pythonshenanigans"
Issues = "https://github.com/dnd-ed/pythonshenanigans/issues"

[project.optional-dependencies]
# Optional zstd backends. On Python < 3.14 `pyzstd` is a hard requirement, and on
# 3.14+ the standard library provides zstd -- so neither needs an extra. Install
# `zstandard` to prefer that implementation (see codec.ENV_BACKEND), or
# `pip install pyzstd` on 3.14+ to force that one instead.
zstandard = ["zstandard>=0.22,<1.0.0"]
# Pinned: an unpinned linter/test runner can turn CI red with no repo change.
dev = ["pytest>=9.0,<10.0", "pytest-cov>=7.0,<8.0", "ruff==0.17.5"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
# The docs site is a Next.js app; nothing in it is Python.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF012: the Animations tables are deliberately plain class attributes;
# annotating ~800 entries with ClassVar would be pure noise.
ignore = ["RUF012"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
