[project]
name = "pythonshenanigans"
version = "1.0.0"
description = "A Python library for creating, loading and modifying Jujutsu Shenanigans movesets."
authors = [
    {name = "akinari (aki)", email = "pts@itzdanti.dev"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Python 3.14+ ships zstd in the standard library, so a binding is only
    # needed on older interpreters.
    #
    # libjjs pinned `zstd>=1.5.7.3`, but that release is YANKED on PyPI and the
    # pin is therefore uninstallable; pyzstd is used instead.
    "pyzstd (>=0.15.0,<1.0.0); python_version < '3.14'",
]

[project.urls]
Homepage = "https://github.com/dnd-ed/pythonshenanigans"
Repository = "https://github.com/dnd-ed/pythonshenanigans"
Issues = "https://github.com/dnd-ed/pythonshenanigans/issues"

[project.optional-dependencies]
pyzstd = ["pyzstd"]
zstandard = ["zstandard"]
dev = ["pytest"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
