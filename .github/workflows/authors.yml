# Reports contributors who are missing from `[project] authors` in
# pyproject.toml.
#
# This workflow only READS. It never edits or commits, so the author list is
# entirely under your control.
#
# Why it no longer auto-commits: deriving the list from git history means any
# entry you delete is silently re-added on the very next push, and a person who
# has two git identities ends up listed twice. See `.mailmap`, which normalises
# contributor identities so this report is accurate.

name: authors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-authors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so every contributor is visible, not just this push.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade tomlkit

      - run: python .github/scripts/add_authors.py --check
