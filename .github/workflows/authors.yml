# Adds every git contributor to `[project] authors` in pyproject.toml, if they
# are not already there.
#
# Identities are read through `git log`'s %aN/%aE, which respect `.mailmap`, so
# one person committing under several names/emails is credited only once.
#
# To opt an identity out, add it to `.github/authors-ignore.txt`. That is the
# supported way to remove someone: because the list is derived from git history,
# deleting an entry from pyproject.toml is undone on the next push.
#
# If it changes pyproject.toml this commits and pushes back. Two guards stop the
# bot commit from re-triggering itself: the job is skipped when the actor is the
# bot, and the commit message contains [skip ci].

name: authors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  add-authors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so every contributor is visible, not just this push.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade tomlkit

      - run: python .github/scripts/add_authors.py

      - name: Commit and push if authors changed
        run: |
          if git diff --quiet -- pyproject.toml; then
            echo "no new authors to add"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add contributors to pyproject.toml [skip ci]" -- pyproject.toml
          git push
