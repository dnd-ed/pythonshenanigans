# Build, test, publish to PyPI, and attach the distributions to the GitHub Release.
#
# Publishing uses PyPI "trusted publishing" (OIDC) -- no API token is stored.
# One-time setup:
#   1. On PyPI, add a trusted publisher for project `pythonshenanigans`:
#        owner:       dnd-ed
#        repository:  pythonshenanigans
#        workflow:    publish.yml
#        environment: pypi
#   2. In the GitHub repo settings, create an environment named `pypi`.
#
# Then publish by creating a GitHub Release (tag it `v1.0.0`, matching
# `project.version` in pyproject.toml).

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # From the dev extra, so the linter version has a single source of truth.
      - run: python -m pip install -e ".[dev]"

      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.backend || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows too: one test spawns subprocesses, which behaves differently.
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          # Exercises an alternative zstd backend on top of the default.
          - os: ubuntu-latest
            python-version: "3.13"
            backend: zstandard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip

      - name: Install the selected zstd backend
        if: matrix.backend
        run: python -m pip install "${{ matrix.backend }}"

      # Exercises the declared dependency: 3.14 uses the standard library's
      # zstd, 3.13 installs the pyzstd requirement.
      - run: python -m pip install -e ".[dev]"

      - name: Tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: >
          python -m pytest -q
          --cov=pythonshenanigans
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=95
        env:
          PYTHONSHENANIGANS_ZSTD_BACKEND: ${{ matrix.backend }}

      # The total gate can be masked by one large well-covered module, so every
      # module also has to clear its own floor.
      - name: Check per-file coverage floors
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python scripts/check_coverage_floors.py

      - name: Tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.14'
        run: python -m pytest -q
        env:
          PYTHONSHENANIGANS_ZSTD_BACKEND: ${{ matrix.backend }}

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::pyproject version '$version' does not match release tag '$tag'"
            exit 1
          fi
          echo "version $version matches tag $tag"

      - run: python -m pip install --upgrade build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: attach to GitHub Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job only downloads an artifact, so there is no .git directory
          # for `gh` to infer the repository from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
