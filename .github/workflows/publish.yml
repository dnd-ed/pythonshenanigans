# Build, test, publish to PyPI, and attach the distributions to the GitHub Release.
#
# Publishing uses PyPI "trusted publishing" (OIDC) -- no API token is stored.
# One-time setup:
#   1. On PyPI, add a trusted publisher for project `pythonshenanigans`:
#        owner:       dnd-ed
#        repository:  pythonshenanigans
#        workflow:    publish.yml
#        environment: pypi
#   2. In the GitHub repo settings, create an environment named `pypi`.
#
# Then publish by creating a GitHub Release (tag it `v1.0.0`, matching
# `project.version` in pyproject.toml).

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip

      # 3.14 uses the standard library's zstd; 3.13 pulls the declared `zstd`
      # dependency. pyzstd is installed as a guaranteed fallback backend so the
      # suite is not blocked by a single binding's availability.
      - run: python -m pip install -e ".[dev]" pyzstd

      - run: python -m pytest -q

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::pyproject version '$version' does not match release tag '$tag'"
            exit 1
          fi
          echo "version $version matches tag $tag"

      - run: python -m pip install --upgrade build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: attach to GitHub Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
